server {
    listen 80;
    server_name factum.pyragogy.org;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 256;

    # Asset statici con cache a lungo termine (hash in filename)
    location /_astro/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Favicon
    location /favicon.svg {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # SPA fallback (per rotta unica, ma teniamo per sicurezza)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Log
    access_log /var/log/nginx/landing-access.log;
    error_log  /var/log/nginx/landing-error.log;
}